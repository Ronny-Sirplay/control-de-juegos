<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de juegos · Sirplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0E3; --panel:#FAFCF7; --panel-2:#F1F6EC; --ink:#14251A; --ink-2:#4A5D4F; --ink-3:#74867A;
  --line:#CFDAC7; --line-2:#E1E9DA;
  --brand:#1E4D2B; --brand-ink:#F2F8EC;
  --ok:#5A9A3A; --ok-soft:#DCEBD0; --ok-ink:#2B5D16;
  --warn:#EBA710; --warn-soft:#FCEBB8; --warn-ink:#6A4600;
  --crit:#C0392F; --crit-soft:#F7DAD5;
  --pend:#C5D0BF; --focus:#2F6FDE;
  --band-opt:#1F5A2A; --band-opt-ink:#EFF8E8;
  --band-obs:#F1C04A; --band-obs-ink:#2A2000;
  --band-crit:#B4322A; --band-crit-ink:#FFF1EE;
  --band-none:#5D7062; --band-none-ink:#F1F6EE;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-b:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1610; --panel:#16201A; --panel-2:#1B271F; --ink:#E5EFE2; --ink-2:#A6B8A9; --ink-3:#7B8E80;
    --line:#2B3A2F; --line-2:#223026; --brand:#3E8B50; --brand-ink:#0C170F;
    --ok:#7DBB5B; --ok-soft:#21381A; --ok-ink:#A9DC8C;
    --warn:#F0B733; --warn-soft:#3B2F12; --warn-ink:#F4D27A;
    --crit:#E5665C; --crit-soft:#41211D; --pend:#3A473D; --focus:#6FA0F5;
    --band-opt:#236131; --band-obs:#E2AE33; --band-crit:#A82E27;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1610; --panel:#16201A; --panel-2:#1B271F; --ink:#E5EFE2; --ink-2:#A6B8A9; --ink-3:#7B8E80;
  --line:#2B3A2F; --line-2:#223026; --brand:#3E8B50; --brand-ink:#0C170F;
  --ok:#7DBB5B; --ok-soft:#21381A; --ok-ink:#A9DC8C;
  --warn:#F0B733; --warn-soft:#3B2F12; --warn-ink:#F4D27A;
  --crit:#E5665C; --crit-soft:#41211D; --pend:#3A473D; --focus:#6FA0F5;
  --band-opt:#236131; --band-obs:#E2AE33; --band-crit:#A82E27;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.muted{color:var(--ink-2)}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* botones y campos */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn.flat{border-color:transparent;background:transparent}
.btn.flat:hover{background:var(--panel-2)}
.icon{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:7px;color:var(--ink-2);position:relative}
.icon:hover{background:var(--panel-2);border-color:var(--line)}
.icon .badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px 11px;min-height:38px}
.inp::placeholder{color:var(--ink-3)}
textarea.inp{resize:vertical;line-height:1.4}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-bar{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brandmark{font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--brand)}
:root[data-theme="dark"] .brandmark{color:var(--ok)}
.ctl-title{display:flex;align-items:center;gap:10px;min-width:0}
.ctl-title b{font-family:var(--font-d);font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl-title span{color:var(--ink-2);font-size:14px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--ink-2)}
.tab:hover{background:var(--panel-2)}
.tab[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;z-index:30;box-shadow:0 10px 30px rgba(10,30,15,.18)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;font-size:14px}
.menu button:hover{background:var(--panel-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* estados */
.st-opt{--st:var(--ok);--st-bg:var(--band-opt);--st-ink:var(--band-opt-ink)}
.st-obs{--st:var(--warn);--st-bg:var(--band-obs);--st-ink:var(--band-obs-ink)}
.st-crit{--st:var(--crit);--st-bg:var(--band-crit);--st-ink:var(--band-crit-ink)}
.st-none{--st:var(--pend);--st-bg:var(--band-none);--st-ink:var(--band-none-ink)}
.strip{border-top:1px solid var(--line-2);background:var(--panel-2)}
.strip-in{display:flex;align-items:center;gap:14px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap;font-size:14px}
.strip .dot{width:12px;height:12px;border-radius:50%;background:var(--st)}
.strip b{font-family:var(--font-d);font-weight:700}
.strip-pct{font-family:var(--font-d);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.strip-meta{color:var(--ink-2)}
.strip-prog{flex:1;min-width:120px;max-width:340px;height:8px;background:var(--pend);border-radius:4px;overflow:hidden;margin-left:auto}
.strip-prog i{display:block;height:100%;background:var(--brand)}
:root[data-theme="dark"] .strip-prog i{background:var(--ok)}

main.wrap{padding-top:26px;padding-bottom:60px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-h p{color:var(--ink-2);font-size:14px;width:100%;margin-top:-8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* banda de estatus */
.band{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.band-l{background:var(--st-bg);color:var(--st-ink);padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.band-plat{font-size:15px;font-weight:600;opacity:.85}
.band-status{font-family:var(--font-d);font-weight:800;font-size:clamp(34px,4.2vw,62px);line-height:.98;letter-spacing:-.03em;margin-top:10px}
.band-desc{font-size:16px;max-width:36ch;margin-top:16px}
.band-rule{font-size:13px;opacity:.8}
.band-r{padding:22px 28px 20px;display:grid;gap:20px;align-content:space-between}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gauges figure{margin:0;text-align:center}
.gauges svg{width:100%;max-width:260px;height:auto}
.gauges figcaption{margin-top:2px;color:var(--ink-2);font-size:14px}
.gauges figcaption b{display:block;font-family:var(--font-d);font-size:34px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--line);padding-top:16px}
.kpis>div{padding:0 16px;border-left:1px solid var(--line)}
.kpis>div:first-child{padding-left:0;border-left:0}
.kpis dt{color:var(--ink-2);font-size:13px}
.kpis dd{margin:2px 0 0;font-family:var(--font-d);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.g-track{stroke:var(--line)}
.g-needle{stroke:var(--ink)}
.g-hub{fill:var(--ink)}
.g-txt{fill:var(--ink-3);font-size:10px;font-family:var(--font-b)}

/* gráficos */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.legend i,.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.br{display:grid;grid-template-columns:150px 1fr 190px;gap:14px;align-items:center;padding:6px 0}
.br-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-track{display:flex;height:22px;background:var(--panel-2);border-radius:5px;overflow:hidden;border:1px solid var(--line-2)}
.br-track i{display:block;height:100%}
.br-track i+i{border-left:1px solid var(--panel)}
.br-v{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.br-v b{font-family:var(--font-d);font-size:16px}
.br-v span{font-size:12px;color:var(--ink-2)}
.b-ok{background:var(--ok);min-width:0}.b-fail{background:var(--warn)}.b-pend{background:var(--pend)}
.br-track i[style*="width:0%"]{display:none}
.two{display:grid;grid-template-columns:7fr 5fr;gap:20px;align-items:start}
.two .sec{margin-top:20px}
.chart-svg{width:100%;height:auto;display:block}
.ax{stroke:var(--line-2)}.ax-t{fill:var(--ink-3);font-size:11px;font-family:var(--font-b)}
.col-lbl{fill:var(--ink-2);font-size:11px;font-family:var(--font-b)}
.col-tot{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font-b)}
.err-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.err-list li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start}
.err-list i{width:12px;height:12px;border-radius:3px;margin-top:4px}
.err-list span{overflow-wrap:anywhere}
.err-list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pie-wrap{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:22px;align-items:center}
.donut{width:100%;height:auto;display:block}
.d-track{stroke:var(--panel-2)}
.d-num{font-family:var(--font-d);font-weight:800;fill:var(--ink)}
.d-sub{font-size:9px;fill:var(--ink-3);font-family:var(--font-b)}
.empty-note{padding:26px 10px;text-align:center;color:var(--ink-2)}

.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.pc{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.pc h3{font-family:var(--font-d);font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .donut{max-width:150px;margin:0 auto}
.pc dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:14px}
.pc dt{color:var(--ink-2)} .pc dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pc .obs{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:8px;min-height:2.6em;overflow-wrap:anywhere}
.pc .btn{align-self:flex-start}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel-2)}
.mini{display:inline-flex;width:90px;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--st)}
.scroll-x{overflow-x:auto}

/* inicio */
.home-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.home-h h1{font-family:var(--font-d);font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.home-lead{color:var(--ink-2);max-width:62ch;margin:10px 0 24px;font-size:16px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap}
.empty-home{border:1.5px dashed var(--line);border-radius:14px;padding:46px 24px;text-align:center;background:var(--panel)}
.empty-home h2{font-family:var(--font-d);font-size:22px;margin-bottom:8px}
.empty-home p{color:var(--ink-2);max-width:52ch;margin:0 auto 20px}
.foot-note{margin-top:22px;font-size:13px;color:var(--ink-3)}

/* revisión */
.rv{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.side{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.side h2{font-family:var(--font-d);font-size:16px;padding:6px 8px 10px}
.pv{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;padding:10px;margin-bottom:2px}
.pv:hover{background:var(--panel-2)}
.pv.on{background:var(--panel-2);border-color:var(--line)}
.pv-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.pv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-pct{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.pv-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--pend);margin:7px 0 5px}
.pv-bar i{display:block;height:100%}
.pv-meta{font-size:12px;color:var(--ink-2)}
.add-prov{display:flex;gap:8px;padding:10px 4px 2px;border-top:1px solid var(--line-2);margin-top:8px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.dh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prov-name{font-family:var(--font-d);font-weight:800;font-size:28px;letter-spacing:-.02em;border:1px solid transparent;background:transparent;border-radius:7px;padding:2px 8px;margin-left:-8px;min-width:0;flex:1 1 240px}
.prov-name:hover{border-color:var(--line)}
.dh-actions{display:flex;gap:8px;flex-wrap:wrap}
.prov-obs{margin-top:10px}
.stats-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.stats-row .donut{width:104px;flex:none}
.stat-n{display:flex;gap:22px;flex-wrap:wrap}
.stat-n div{min-width:80px}
.stat-n b{display:block;font-family:var(--font-d);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-n span{font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.toolbar .grow-in{flex:1 1 260px;display:flex;gap:8px}
.toolbar .search{flex:0 1 220px}
.lhead,.grow{display:grid;grid-template-columns:52px minmax(150px,1.2fr) minmax(170px,1.5fr) 34px 34px;gap:8px;align-items:center}
.lhead{font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#rv-list{max-height:min(68vh,760px);overflow:auto;border:1px solid var(--line-2);border-radius:9px}
#rv-list .lhead{position:sticky;top:0;z-index:2}
.grow{padding:4px 10px;border-bottom:1px solid var(--line-2)}
.grow:last-child{border-bottom:0}
.grow.s-2{background:var(--warn-soft)}
.cb{width:26px;height:26px;border:2px solid var(--line);background:var(--panel);border-radius:7px;display:grid;place-items:center;padding:0;color:transparent}
.cb:hover{border-color:var(--ink-3)}
.s-1 .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.s-2 .cb{background:var(--warn);border-color:var(--warn);color:#3a2700}
.gname-in,.gobs{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.gname-in:hover,.gobs:not(:disabled):hover{border-color:var(--line)}
.gname-in:focus,.gobs:focus{background:var(--panel);border-color:var(--line)}
.gobs:disabled{opacity:.35}
.no-rows{padding:30px 10px;text-align:center;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);margin-top:10px}

/* capturas */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);text-align:left;padding:0;display:block;width:100%}
.cap img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--panel-2)}
.cap div{padding:10px 12px;font-size:13px;color:var(--ink-2)}
.cap b{display:block;color:var(--ink);font-size:14px}

/* diálogo */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(900px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,24,14,.55)}
.dlg-in{padding:24px}
.dlg-in h2{font-family:var(--font-d);font-size:22px;margin-bottom:6px;letter-spacing:-.01em}
.dlg-in>p{color:var(--ink-2);margin-bottom:16px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.ev-grid figure{margin:0;display:grid;gap:6px}
.ev-grid img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.ev-drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--ink-2)}
.zoom-img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:8px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:14px}

};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const ST={
  opt:{t:'Óptimo'}, obs:{t:'En observación'}, crit:{t:'Crítico'}, none:{t:'Sin revisar'}
};
const ERR_COLORS=['#C0392F','#2F6FDE','#E9A100','#7A4FB5','#2A9D8F','#D9622B','#B5457A','#5F7A8C'];
const DEFAULT_OBS=['Currency rate is invalid','ERROR: Juego no disponible','Juego deshabilitado','Pantalla negra','El nombre no coincide con el juego','A Generic Error Ocurred','Error Game not avallable','Could not launch the game. Please try again later.'];

/* ============ cálculo ============ */
function calc(c){
  const provs=c.p.map(p=>{
    let ok=0,fail=0,pend=0;
    for(const g of p.g){ if(g.s===1)ok++; else if(g.s===2)fail++; else pend++; }
    const rev=ok+fail;
    return {p,ok,fail,pend,total:p.g.length,rev,pct:rev?ok/rev:null};
  });
  const T={ok:0,fail:0,pend:0,total:0};
  provs.forEach(x=>{T.ok+=x.ok;T.fail+=x.fail;T.pend+=x.pend;T.total+=x.total;});
  T.rev=T.ok+T.fail; T.pct=T.rev?T.ok/T.rev:null;
  const wd=provs.filter(x=>x.rev>0);
  T.provWith=wd.length; T.provOK=wd.filter(x=>x.fail===0).length; T.provPct=wd.length?T.provOK/wd.length:null;
  const map=new Map();
  provs.forEach(x=>x.p.g.forEach(g=>{
    if(g.s!==2)return;
    const raw=(g.o||'').replace(/\s+/g,' ').trim(); const key=raw?raw.toLowerCase():'\u0000';
    let e=map.get(key); if(!e){e={label:raw||'Sin observación',n:0,by:new Map()};map.set(key,e);}
    e.n++; e.by.set(x.p.id,(e.by.get(x.p.id)||0)+1);
  }));
  let errs=[...map.values()].sort((a,b)=>b.n-a.n);
  if(errs.length>8){
    const head=errs.slice(0,7),tail=errs.slice(7);
    const o={label:'Otros ('+tail.length+' tipos)',n:0,by:new Map(),other:true};
    tail.forEach(e=>{o.n+=e.n;e.by.forEach((v,k)=>o.by.set(k,(o.by.get(k)||0)+v));});
    errs=head.concat([o]);
  }
  errs.forEach((e,i)=>e.color=e.other?'#8A9A8E':ERR_COLORS[i]);
  T.status=T.pct==null?'none':T.pct>=.9?'opt':T.pct>=.8?'obs':'crit';
  return {provs,T,errs};
}

/* ============ gráficos SVG ============ */
function gauge({pct,bands,fill}){
  const cx=100,cy=100,r=78,sw=15;
  const pt=(p,rr)=>{const a=Math.PI*(1-p);return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)];};
  const arc=(p0,p1)=>{const [x0,y0]=pt(p0,r),[x1,y1]=pt(p1,r);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;};
  let s=`<svg viewBox="0 0 200 128" role="img" aria-label="Indicador ${pf(pct)}">`;
  if(bands){
    bands.forEach(b=>{s+=`<path d="${arc(b.from,b.to)}" fill="none" stroke-width="${sw}" style="stroke:${b.color}"/>`;});
  }else{
    s+=`<path d="${arc(0,1)}" fill="none" stroke-width="${sw}" class="g-track"/>`;
    if(pct!=null&&pct>0) s+=`<path d="${arc(0,Math.min(pct,1))}" fill="none" stroke-width="${sw}" stroke-linecap="round" style="stroke:${fill}"/>`;
  }
  if(pct!=null){
    const [tx,ty]=pt(Math.min(pct,1),r-sw/2-6);
    s+=`<line x1="${cx}" y1="${cy}" x2="${tx.toFixed(2)}" y2="${ty.toFixed(2)}" stroke-width="3.5" stroke-linecap="round" class="g-needle"/><circle cx="${cx}" cy="${cy}" r="7" class="g-hub"/>`;
  }
  s+=`<text x="${cx-r}" y="120" text-anchor="middle" class="g-txt">0%</text><text x="${cx+r}" y="120" text-anchor="middle" class="g-txt">100%</text></svg>`;
  return s;
}
function donut(slices,{size=132,sw=18,center='',sub='',label=''}={}){
  const r=(size-sw)/2,C=2*Math.PI*r,c=size/2,total=slices.reduce((a,s)=>a+s.v,0);
  let out=`<svg viewBox="0 0 ${size} ${size}" class="donut" role="img" aria-label="${esc(label)}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}" class="d-track"/>`;
  if(total>0){
    let off=0;const multi=slices.filter(s=>s.v>0).length>1;
    slices.forEach(s=>{
      if(!s.v)return; const len=C*s.v/total; const d=Math.max(len-(multi?1.6:0),0.01);
      out+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${sw}" style="stroke:${s.color}" stroke-dasharray="${d.toFixed(2)} ${(C-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${c} ${c})" data-tip="${esc(s.tip||'')}"/>`;
      off+=len;
    });
  }
  if(center!=='') out+=`<text x="${c}" y="${c+(sub?0:6)}" text-anchor="middle" class="d-num" style="font-size:${size*0.17}px">${esc(center)}</text>`;
  if(sub) out+=`<text x="${c}" y="${c+size*0.13}" text-anchor="middle" class="d-sub">${esc(sub)}</text>`;
  return out+'</svg>';
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return Math.max(1,(f<=1?1:f<=2?2:f<=5?5:10)*p);}
function stackedCols(k){
  const W=680,H=310,ml=38,mr=8,mt=16,mb=84,iw=W-ml-mr,ih=H-mt-mb,n=k.provs.length;
  const max=Math.max(1,...k.provs.map(x=>x.fail));
  const step=niceStep(max/4),top=Math.ceil(max/step)*step;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Fallas por proveedor y tipo de error">`;
  for(let v=0;v<=top;v+=step){const y=mt+ih-(v/top)*ih;s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" class="ax"/><text x="${ml-6}" y="${y+4}" text-anchor="end" class="ax-t">${v}</text>`;}
  const slot=iw/n,bw=Math.min(54,slot*0.62);
  k.provs.forEach((x,i)=>{
    const cx=ml+slot*(i+.5);let y=mt+ih;
    k.errs.forEach(e=>{
      const v=e.by.get(x.p.id)||0; if(!v)return; const h=v/top*ih; y-=h;
      s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h-1,0.5).toFixed(1)}" rx="2" style="fill:${e.color}" data-tip="${esc(x.p.n+' · '+e.label+': '+v)}"/>`;
    });
    if(x.fail>0) s+=`<text x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="col-tot">${x.fail}</text>`;
    const nm=x.p.n.length>15?x.p.n.slice(0,14)+'…':x.p.n;
    s+=`<text transform="translate(${(cx+4).toFixed(1)},${mt+ih+14}) rotate(-35)" text-anchor="end" class="col-lbl"><title>${esc(x.p.n)}</title>${esc(nm)}</text>`;
  });
  return s+'</svg>';
}
function barsHTML(k,mode){
  const maxT=Math.max(1,...k.provs.map(x=>x.total));
  return `<div class="legend"><span><i style="background:var(--ok)"></i>Funciona</span><span><i style="background:var(--warn)"></i>No funciona</span><span><i style="background:var(--pend)"></i>Pendiente</span></div>`+
  k.provs.map(x=>{
    const base=mode==='pct'?Math.max(1,x.total):maxT; const w=n=>(n/base*100).toFixed(2);
    const seg=(n,cls,lab)=>n>0?`<i class="${cls}" style="width:${w(n)}%;min-width:4px" data-tip="${esc(x.p.n+' · '+lab+': '+n)}"></i>`:'';
    return `<div class="br"><div class="br-n" title="${esc(x.p.n)}">${esc(x.p.n)}</div><div class="br-track">${seg(x.ok,'b-ok','Funciona')}${seg(x.fail,'b-fail','No funciona')}${seg(x.pend,'b-pend','Pendiente')}</div><div class="br-v"><b>${pf(x.pct)}</b><span>${x.ok} funcionan · ${x.fail} fallan</span></div></div>`;
  }).join('');
}


/* ============ cliente Supabase ============ */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }

const RAW_HASH = window.location.hash || '';
const INVITE_FLOW = /type=invite|type=recovery/.test(RAW_HASH);

/* ============ estado ============ */
const SESSION={user:null,perfil:null};
let PERFILES=[]; const PMAP=new Map();
const DB={controles:[],activeId:null,detail:null};
const UI={view:'loading',tab:'panel',prov:null,filter:'all',q:'',barMode:'qty',menu:false,
  authMode:INVITE_FLOW?'setpass':'login',authErr:'',authMsg:'',authBusy:false};

const nombreDe=id=>{const p=PMAP.get(id);return p?(p.nombre||p.email||'—'):'—';};

const isAdmin=()=>!!(SESSION.perfil&&SESSION.perfil.rol==='admin');

function fdt(iso){ if(!iso) return ''; const d=new Date(iso);
  return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}); }

/* ============ toasts / util UI ============ */
function toast(msg,action){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${action?`<button data-a="${action.a}">${esc(action.l)}</button>`:''}`;t.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},action?7000:3400);
}
function setBusy(b){UI.authBusy=b;}

/* ============ capturas: URLs firmadas ============ */
const SIGN=new Map();
async function getSignedUrls(items){ // [{id,ruta}]
  const need=items.filter(it=>{const c=SIGN.get(it.id);return !c||c.exp<Date.now()+30000;});
  if(need.length){
    try{
      const {data}=await sb.storage.from('capturas').createSignedUrls(need.map(n=>n.ruta),3600);
      if(data) data.forEach((d,i)=>{ if(d&&d.signedUrl) SIGN.set(need[i].id,{url:d.signedUrl,exp:Date.now()+3500*1000}); });
    }catch(e){}
  }
  const out={};items.forEach(it=>{const c=SIGN.get(it.id);if(c)out[it.id]=c.url;});return out;
}
function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function compress(file){
  const url=await readAsDataURL(file);
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
  const sc=Math.min(1,1600/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.82));
}

/* ============ carga de datos ============ */
async function cargarPerfil(){
  const {data:{user}}=await sb.auth.getUser();
  SESSION.user=user;
  if(!user){SESSION.perfil=null;return;}
  let {data,error}=await sb.from('perfiles').select('*').eq('id',user.id).maybeSingle();
  if(!data && !error){ // recién creado por el disparador, puede tardar un instante

function mapDetalle(rows){
  // rows: proveedores con juegos(capturas) anidados desde Supabase
  return rows.map(p=>({
    id:p.id,n:p.nombre,o:p.observaciones||'',asignado_a:p.asignado_a,orden:p.orden,
    g:(p.juegos||[]).slice().sort((a,b)=>a.orden-b.orden).map(g=>({
      id:g.id,n:g.nombre,s:g.estado,o:g.observacion||'',orden:g.orden,
      by:g.actualizado_por,at:g.actualizado_en,
      caps:(g.capturas||[]).slice().sort((a,b)=>a.subido_en.localeCompare(b.subido_en))
    }))
  }));

async function cargarDetalle(controlId){
  const {data,error}=await sb.from('proveedores')
    .select('id,nombre,observaciones,asignado_a,orden,juegos(id,nombre,estado,observacion,orden,actualizado_por,actualizado_en,capturas(id,ruta,subido_por,subido_en))')
    .eq('control_id',controlId).order('orden',{ascending:true}).order('orden',{ascending:true,foreignTable:'juegos'});
  if(error){toast('No se pudo cargar el control.');return null;}
  return {id:controlId,p:mapDetalle(data)};
}

/* ============ realtime ============ */
function idxProv(pid){return DB.detail?DB.detail.p.findIndex(p=>p.id===pid):-1;}
function idxJuego(pv,gid){return pv.g.findIndex(g=>g.id===gid);}
function juegoIdsActuales(){const s=new Set();if(DB.detail)DB.detail.p.forEach(p=>p.g.forEach(g=>s.add(g.id)));return s;}
function suscribirRealtime(controlId){
  desuscribirRealtime();
  CH=sb.channel('control-'+controlId)
    .on('postgres_changes',{event:'*',schema:'public',table:'juegos',filter:'control_id=eq.'+controlId},onJuegoRT)
    .on('postgres_changes',{event:'*',schema:'public',table:'proveedores',filter:'control_id=eq.'+controlId},onProvRT)
    .on('postgres_changes',{event:'*',schema:'public',table:'capturas'},onCapRT)
    .subscribe(status=>{ SYNC.status=status==='SUBSCRIBED'?'on':(status==='CHANNEL_ERROR'||status==='TIMED_OUT')?'busy':'off'; renderSyncDot(); });
}
function desuscribirRealtime(){ if(CH){sb.removeChannel(CH);CH=null;} SYNC.status='off'; }
function onProvRT(payload){
  if(!DB.detail)return; const {eventType,new:n,old:o}=payload;
  if(eventType==='INSERT'){ if(!DB.detail.p.some(p=>p.id===n.id)) DB.detail.p.push({id:n.id,n:n.nombre,o:n.observaciones||'',asignado_a:n.asignado_a,orden:n.orden,g:[]}); }
  else if(eventType==='UPDATE'){ const i=idxProv(n.id); if(i>-1){const g=DB.detail.p[i].g; DB.detail.p[i]={id:n.id,n:n.nombre,o:n.observaciones||'',asignado_a:n.asignado_a,orden:n.orden,g}; if(UI.prov===n.id){} } }
  else if(eventType==='DELETE'){ const i=idxProv(o.id); if(i>-1){DB.detail.p.splice(i,1); if(UI.prov===o.id)UI.prov=null;} }
  DB.detail.p.sort((a,b)=>a.orden-b.orden); render();
}
function onJuegoRT(payload){
  if(!DB.detail)return; const {eventType,new:n,old:o}=payload;
  const pid=n?n.proveedor_id:o.proveedor_id; const i=idxProv(pid); if(i<0)return; const pv=DB.detail.p[i];
  if(eventType==='INSERT'){ if(!pv.g.some(g=>g.id===n.id)) pv.g.push({id:n.id,n:n.nombre,s:n.estado,o:n.observacion||'',orden:n.orden,by:n.actualizado_por,at:n.actualizado_en,caps:[]}); }
  else if(eventType==='UPDATE'){ const j=idxJuego(pv,n.id); if(j>-1){const caps=pv.g[j].caps; pv.g[j]={id:n.id,n:n.nombre,s:n.estado,o:n.observacion||'',orden:n.orden,by:n.actualizado_por,at:n.actualizado_en,caps};} }
  else if(eventType==='DELETE'){ const j=idxJuego(pv,o.id); if(j>-1)pv.g.splice(j,1); }
  pv.g.sort((a,b)=>a.orden-b.orden);
  render();
}
function onCapRT(payload){
  if(!DB.detail)return; const {eventType,new:n,old:o}=payload;
  const gid=n?n.juego_id:o.juego_id; if(!juegoIdsActuales().has(gid))return;
  for(const pv of DB.detail.p){ const j=idxJuego(pv,gid); if(j>-1){
    const g=pv.g[j];
    if(eventType==='INSERT'){ if(!g.caps.some(c=>c.id===n.id)) g.caps.push(n); }
    else if(eventType==='DELETE'){ g.caps=g.caps.filter(c=>c.id!==o.id); }
    break;
  }}
  render();
}
function renderSyncDot(){ const d=$('#sync-dot'); if(d){d.className='sync-dot'+(SYNC.status==='on'?'':SYNC.status==='busy'?' busy':' off'); d.title=SYNC.status==='on'?'Conectado en vivo':SYNC.status==='busy'?'Reconectando…':'Sin conexión en vivo';} }

}

function parseBulk(text,keep){
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    if(!raw.trim())return;
    const parts=raw.split('\t').map(s=>s.trim()); const name=parts[0]; if(!name)return;
    if((parts[1]||'').toLowerCase()==='funciona')return;
    let s=0,o='';
    if(keep){const f=(parts[1]||'').toUpperCase();if(f==='TRUE')s=1;else if(f==='FALSE'){s=2;o=parts[2]||'';}else if(parts[1]){s=2;o=parts[1];}}
    out.push({n:name,s,o});
  });
  return out;
}

/* ============ ayudas de datos remotos ============ */
async function chunkedInsert(table,rows,size=500){
  const out=[];
  for(let i=0;i<rows.length;i+=size){
    const {data,error}=await sb.from(table).insert(rows.slice(i,i+size)).select();
    if(error) throw error;
    out.push(...data);
  }
  return out;
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('No se pudo cargar el módulo de Excel.'));document.head.appendChild(s);});
}
async function saveFile(filename,data){
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==='function') dl=await window.claude.use('downloads'); }catch(e){dl=null;}
  if(dl){ try{await dl.save({filename,data});toast('Archivo listo: '+filename);}catch(e){ if(e&&e.code==='declined')return; toast('No se pudo guardar el archivo.'); } return; }
  try{
    const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){toast('No se pudo descargar el archivo.');}
}
const fnameBase=c=>{const d=c.date||today();return 'Control_de_Juegos_'+slug(c.plat).toUpperCase()+'_'+d.slice(8,10)+'_'+d.slice(5,7)+'_'+d.slice(2,4);};

/* ============ acciones sobre controles ============ */
async function crearControlConCopia(plat,fecha,srcId,keep){
  const {data:ctl,error}=await sb.from('controles').insert({plataforma:plat.trim(),fecha}).select().single();
  if(error){toast('No se pudo crear el control.');return null;}
  if(srcId&&keep){
    try{
      const {data:provs,error:e2}=await sb.from('proveedores').select('nombre,orden,juegos(nombre,orden)').eq('control_id',srcId).order('orden').order('orden',{foreignTable:'juegos'});
      if(!e2&&provs) for(const p of provs){
        const {data:np,error:e3}=await sb.from('proveedores').insert({control_id:ctl.id,nombre:p.nombre,orden:p.orden}).select().single();
        if(e3)continue;
        if(p.juegos&&p.juegos.length) await chunkedInsert('juegos',p.juegos.map(g=>({proveedor_id:np.id,nombre:g.nombre,orden:g.orden})));
      }
    }catch(e){toast('El control se creó, pero no se pudo copiar todo el contenido.');}
  }
  return ctl;
}
async function crearProveedor(nombre){
  const orden=DB.detail.p.reduce((m,p)=>Math.max(m,p.orden||0),0)+1;
  const {data,error}=await sb.from('proveedores').insert({control_id:DB.detail.id,nombre,orden}).select().single();
  if(error){toast('No se pudo crear el proveedor.');return null;}
  const np={id:data.id,n:data.nombre,o:'',asignado_a:null,orden:data.orden,g:[]};
  DB.detail.p.push(np); return np;
}
async function crearJuegosBulk(proveedorId,arr){
  const pv=DB.detail.p.find(p=>p.id===proveedorId); if(!pv)return;
  const base=pv.g.reduce((m,g)=>Math.max(m,g.orden||0),0)+1;
  const rows=arr.map((g,i)=>({proveedor_id:proveedorId,nombre:g.n,estado:g.s||0,observacion:g.o||'',orden:base+i}));
  try{
    const data=await chunkedInsert('juegos',rows);
    data.forEach(g=>{ if(!pv.g.some(x=>x.id===g.id)) pv.g.push({id:g.id,n:g.nombre,s:g.estado,o:g.observacion||'',orden:g.orden,by:g.actualizado_por,at:g.actualizado_en,caps:[]}); });
    pv.g.sort((a,b)=>a.orden-b.orden);

function debFields(){ if(!debFields._m) debFields._m=new Map(); return debFields._m; }
function debounced(key,fn,ms=500){ const m=debFields(); clearTimeout(m.get(key)); m.set(key,setTimeout(fn,ms)); }
function guardarProveedorCampo(pid,field,valor){

function guardarJuegoCampo(gid,field,valor){

async function ciclarEstado(gid){

async function marcarPendientesComoFunciona(pid){

  afectados.forEach(g=>{g.s=1;g.by=SESSION.user.id;g.at=new Date().toISOString();});
  const {error}=await sb.from('juegos').update({estado:1}).eq('proveedor_id',pid).eq('estado',0);

/* ============ imágenes ============ */
async function addImages(gid,files){
  const f=findGame(gid); if(!f)return; let n=0;
  for(const file of files){
    if(!file.type.startsWith('image/'))continue;
    try{
      const blob=await compress(file);
      const ruta=DB.detail.id+'/'+gid+'/'+uid()+'.jpg';
      const {error:upErr}=await sb.storage.from('capturas').upload(ruta,blob,{contentType:'image/jpeg'});
      if(upErr){toast('No se pudo subir una captura.');continue;}
      const {data,error}=await sb.from('capturas').insert({juego_id:gid,ruta}).select().single();
      if(error){toast('No se pudo registrar una captura.');continue;}
      if(!f.g.caps.some(c=>c.id===data.id)) f.g.caps.push(data);
      n++;
    }catch(err){toast('No se pudo leer una de las imágenes.');}
  }
  if(n){ if(EV.gid===gid&&dlg.open) evidDlg(gid); toast(n+(n===1?' captura agregada.':' capturas agregadas.')); renderGames(); }
}
async function quitarCaptura(capId){
  const f=findGame(EV.gid); if(!f)return; const cap=f.g.caps.find(c=>c.id===capId); if(!cap)return;
  f.g.caps=f.g.caps.filter(c=>c.id!==capId);
  sb.storage.from('capturas').remove([cap.ruta]).catch(()=>{});
  const {error}=await sb.from('capturas').delete().eq('id',capId);
  if(error)toast('No se pudo quitar la captura.');
  evidDlg(EV.gid); renderGames();
}

async function exportXlsx(c){
  let X;try{toast('Preparando Excel…');X=await loadXLSX();}catch(e){toast(e.message);return;}
  const k=calc(c),T=k.T;
  const res=[['Control de juegos · '+c.plat],['Fecha',fdate(c.date)],[],['Proveedor','Funciona','No funciona','Pendiente','% funcionalidad']];
  k.provs.forEach(x=>res.push([x.p.n,x.ok,x.fail,x.pend,x.pct==null?'':x.pct]));
  res.push(['Total',T.ok,T.fail,T.pend,T.pct==null?'':T.pct]);
  res.push([]);res.push(['Estatus',ST[T.status].t]);res.push(['Juegos funcionando',T.pct==null?'':T.pct]);res.push(['Proveedores sin fallas',T.provPct==null?'':T.provPct]);
  const w1=X.utils.aoa_to_sheet(res);
  for(let r=4;r<4+k.provs.length+1;r++){const a=w1['E'+(r+1)];if(a&&typeof a.v==='number')a.z='0.0%';}
  ['B'+(res.length-1),'B'+res.length].forEach(a=>{if(w1[a]&&typeof w1[a].v==='number')w1[a].z='0.0%';});
  w1['!cols']=[{wch:28},{wch:12},{wch:14},{wch:12},{wch:18}];
  const data=[['Proveedor','Juego','Estatus','Error','Es Funcional','Actualizado por','Actualizado el']];
  k.provs.forEach(x=>x.p.g.forEach(g=>data.push([x.p.n,g.n,g.s===1?true:g.s===2?false:'',g.s===2?(g.o||''):'',g.s===1?1:g.s===2?0:'',g.by?nombreDe(g.by):'',g.at?fdt(g.at):''])));
  const w2=X.utils.aoa_to_sheet(data);w2['!cols']=[{wch:22},{wch:38},{wch:10},{wch:44},{wch:12},{wch:20},{wch:16}];
  const er=[['Tipo de error','Frecuencia']];k.errs.forEach(e=>er.push([e.label,e.n]));
  const w3=X.utils.aoa_to_sheet(er);w3['!cols']=[{wch:60},{wch:12}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,w1,'Resumen');X.utils.book_append_sheet(wb,w2,'Datos_Dashboard');X.utils.book_append_sheet(wb,w3,'Errores');
  const out=X.write(wb,{type:'array',bookType:'xlsx'});
  await saveFile(fnameBase(c)+'.xlsx',new Uint8Array(out));
}
function packJSON(c){
  return JSON.stringify({app:'sirplay-control-juegos',v:2,exported:new Date().toISOString(),
    plat:c.plat,date:c.date,
    p:c.p.map(p=>({n:p.n,o:p.o,asignado:p.asignado_a?nombreDe(p.asignado_a):'',g:p.g.map(g=>({n:g.n,s:g.s,o:g.o}))}))});
}
async function importXlsxFile(file){
  let X;try{toast('Leyendo Excel…');X=await loadXLSX();}catch(e){toast(e.message);return;}
  try{
    const wb=X.read(await file.arrayBuffer(),{type:'array'});
    const name=wb.SheetNames.find(n=>/datos_dashboard/i.test(n));
    if(!name){toast('No se encontró la hoja Datos_Dashboard en este archivo.');return;}
    const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let start=rows.findIndex(r=>String(r[0]||'').trim().toLowerCase()==='proveedor'); start=start<0?0:start+1;
    const order=[],map=new Map();
    for(let i=start;i<rows.length;i++){
      const r=rows[i],pn=String(r[0]==null?'':r[0]).trim(),gn=String(r[1]==null?'':r[1]).trim(); if(!pn||!gn)continue;
      let s=0;const v=r[2];if(v===true||String(v).toUpperCase()==='TRUE'||v===1)s=1;else if(v===false||String(v).toUpperCase()==='FALSE'||v===0)s=2;
      let p=map.get(pn);if(!p){p={n:pn,g:[]};map.set(pn,p);order.push(p);}
      p.g.push({n:gn,s,o:s===2?String(r[3]==null?'':r[3]).trim():''});
    }
    if(!order.length){toast('La hoja Datos_Dashboard no tiene juegos para importar.');return;}
    const m=file.name.match(/Juegos[_ ]+(.+?)[_ ]+(\d\d)_(\d\d)_(\d\d)/i);
    PENDING_IMPORT={plat:m?m[1].replace(/_/g,' ').trim():file.name.replace(/\.[^.]+$/,''),date:m?('20'+m[4]+'-'+m[3]+'-'+m[2]):today(),p:order};
    toast('');$('#toast').hidden=true; newCtlDlg(null,PENDING_IMPORT);
  }catch(e){toast('No se pudo leer el archivo Excel.');}
}

async function handleAuthClick(e){
  const t=e.target.closest('[data-a]'); if(!t)return; const a=t.dataset.a;
  if(a==='auth-forgot'){UI.authMode='forgot';UI.authErr='';UI.authMsg='';render();return;}
  if(a==='auth-login'){UI.authMode='login';UI.authErr='';UI.authMsg='';render();return;}
  if(a==='do-login'){
    const email=$('#a-email').value.trim(),pass=$('#a-pass').value; if(!email||!pass){UI.authErr='Escribe tu correo y tu contraseña.';render();return;}
    UI.authBusy=true;UI.authErr='';render();
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    UI.authBusy=false;
    if(error){UI.authErr='Correo o contraseña incorrectos.';render();return;}
    UI.view='loading';render(); await afterLogin();
  }
  if(a==='send-reset'){
    const email=$('#a-email').value.trim(); if(!email){UI.authErr='Escribe tu correo.';render();return;}
    UI.authBusy=true;UI.authErr='';UI.authMsg='';render();
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
    UI.authBusy=false;
    if(error){UI.authErr='No se pudo enviar el correo. Verifica la dirección.';} else UI.authMsg='Te enviamos un enlace para recuperar tu acceso.';
    render();
  }
  if(a==='set-pass'){
    const p1=$('#a-pass1').value,p2=$('#a-pass2').value;
    if(p1.length<8){UI.authErr='La contraseña debe tener al menos 8 caracteres.';render();return;}
    if(p1!==p2){UI.authErr='Las contraseñas no coinciden.';render();return;}
    UI.authBusy=true;UI.authErr='';render();
    const {error}=await sb.auth.updateUser({password:p1});
    UI.authBusy=false;
    if(error){UI.authErr='No se pudo guardar la contraseña. Pide un nuevo enlace.';render();return;}
    history.replaceState(null,'',window.location.pathname+window.location.search);
    UI.view='loading';render(); await afterLogin();
  }
}

});
document.addEventListener('paste',e=>{
  if(e.target&&e.target.id==='new-game'&&e.clipboardData){
    const txt=e.clipboardData.getData('text');
    if(/\r?\n/.test(txt.trim())){e.preventDefault();addGameFromInput(txt);return;}
  }
  const files=[...(e.clipboardData?e.clipboardData.files:[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  let gid=EV.gid; if(!gid){const row=e.target.closest&&e.target.closest('.grow');if(row)gid=row.dataset.g;}
  if(gid&&canEdit()){e.preventDefault();addImages(gid,files);}
});
async function addGameFromInput(text){
  const p=DB.detail&&DB.detail.p.find(p=>p.id===UI.prov); const i=$('#new-game'); if(!p||!i)return;
  const arr=parseBulk(text!=null?text:i.value,false); if(!arr.length){i.focus();return;}
  if(text==null)i.value='';
  await crearJuegosBulk(p.id,arr);
  if(UI.filter!=='all'||UI.q){UI.filter='all';UI.q='';const s=$('#q');if(s)s.value='';}
  renderGames();refreshStats(); const l=$('#rv-list'); if(l)l.scrollTop=l.scrollHeight; i.focus();
}
$('#file-xlsx').addEventListener('change',e=>{const f=e.target.files[0];if(f)importXlsxFile(f);});
$('#file-json').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJsonFile(f);});
$('#file-img').addEventListener('change',e=>{if(EV.gid&&e.target.files.length)addImages(EV.gid,[...e.target.files]);});
/* tooltip */
const tip=$('#tip');
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&t.dataset.tip){tip.textContent=t.dataset.tip;tip.hidden=false;placeTip(e);}else tip.hidden=true;});
document.addEventListener('pointermove',e=>{if(!tip.hidden)placeTip(e);});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget)tip.hidden=true;});
function placeTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px';}

/* ============ arranque ============ */
async function afterLogin(){
  await cargarPerfil(); await cargarPerfiles(); await cargarControles();
  UI.view='home'; render();
}
async function boot(){
  UI.view='loading'; render();
  if(INVITE_FLOW){ UI.view='auth'; UI.authMode='setpass'; render(); }
  else{
    const {data:{session}}=await sb.auth.getSession();
    if(session) await afterLogin(); else { UI.view='auth'; UI.authMode='login'; render(); }
  }
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){ desuscribirRealtime(); SESSION.user=null; SESSION.perfil=null; UI.view='auth'; UI.authMode='login'; UI.authErr=''; render(); }
    else if(event==='PASSWORD_RECOVERY'){ UI.view='auth'; UI.authMode='setpass'; render(); }
  });
}
boot();
})();
